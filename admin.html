<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voting Admin</title><link rel="stylesheet" href="styles.css"></head><body><main class="wrap"><section id="loginBox" class="card"><h1>Voting Admin</h1><input id="adminKey" type="password" placeholder="Admin key"><button id="adminLogin">Open</button></section><section id="dash" class="hidden"><div class="card"><h2>Election control</h2><div class="row"><select id="phase"><option>NOMINATION</option><option>VOTING</option><option>CLOSED</option></select><button id="savePhase">Set phase</button></div><label class="option"><input id="allowNames" type="checkbox"><span>Allow live association-name suggestions</span></label></div><div class="card"><h2>Members</h2><table><thead><tr><th>Name</th><th>Nomination</th><th>Voted</th></tr></thead><tbody id="members"></tbody></table></div><div class="card"><h2>Confirmed nominations</h2><table><tbody id="noms"></tbody></table></div><div class="card"><h2>Pending candidate suggestions</h2><table><tbody id="suggestions"></tbody></table></div><div class="card"><h2>Results</h2><button id="showResults">Refresh results</button><pre id="results"></pre></div></section></main><script src="config.js"></script><script src="admin.js"></script></body></html>
